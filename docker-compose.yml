services:

  weknow:
    build: .
    container_name: weknow
    ports:
      - "8000:8000"
    # 所有可配置项集中在项目根目录的 .env（参考 .env.example 生成）。
    env_file:
      - .env
    environment:
      # 数据库固定落到挂载卷里，容器重建后知识库不丢。
      RAG_DB_URL: duckdb:///data/weknow.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
